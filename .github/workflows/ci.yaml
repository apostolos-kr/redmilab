---
name: CI
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install lint tools
        run: pip install yamllint ansible ansible-lint

      - name: Run yamllint
        run: yamllint .

      - name: Run ansible-lint
        working-directory: ansible
        run: ansible-lint site.yaml

      - name: Set up Kubeconform
        uses: bmuschko/setup-kubeconform@v1
        with:
          kubeconform-version: '0.8.0'

      - name: Validate Kubernetes manifests
        run: kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.36.5 -ignore-filename-pattern 'values\.yaml$'

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
