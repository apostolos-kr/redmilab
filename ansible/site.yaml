---
- name: Configure DNS
  hosts: all
  become: true
  roles:
    - dns

- name: Setup storage
  hosts: storage
  become: true
  roles:
    - postgresql
    - nfs

- name: Power fixes
  hosts: xiaomi-whyred
  become: true
  roles:
    - cpuidle-fix

- name: Setup k3s nodes
  hosts: k3s_nodes
  become: true
  roles:
    - cronjobs
    - firewall
    - k3s

- name: Setup Argo CD
  hosts: k3s_nodes[0]
  become: true
  roles:
    - argocd
