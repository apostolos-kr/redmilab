---
- name: Disable swapfile
  ansible.builtin.service:
    name: swapfile
    enabled: false
    state: stopped

- name: Disable zram swap
  ansible.builtin.service:
    name: postmarketos-zram-swap
    enabled: false
    state: stopped

- name: Install k3s host dependencies
  ansible.builtin.package:
    name:
      - curl
      - ca-certificates
      - nfs-utils
    state: present
    update_cache: true

- name: Secrets are set
  ansible.builtin.assert:
    that:
      - k3s_token | length > 0
      - k3s_db_password | length > 0
    quiet: true

- name: Download the pinned k3s install script
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/k3s-io/k3s/{{ k3s_version }}/install.sh"
    dest: /tmp/k3s-install.sh
    mode: "0700"

- name: Install k3s
  ansible.builtin.command:
    cmd: sh /tmp/k3s-install.sh
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_SKIP_START: "true"
  notify: Restart k3s

- name: Check host prerequisites for k3s
  ansible.builtin.command: /usr/local/bin/k3s check-config
  register: k3s_check_config
  changed_when: false

- name: Write the k3s config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  no_log: true
  diff: false
  notify: Restart k3s

- name: Start k3s after Tailscale
  ansible.builtin.lineinfile:
    path: /etc/conf.d/k3s
    search_string: "rc_need="
    line: 'rc_need="tailscale"'
    create: true
    mode: "0644"

- name: Apply a pending restart
  ansible.builtin.meta: flush_handlers

- name: Enable and start k3s
  ansible.builtin.service:
    name: k3s
    enabled: true
    state: started

- name: Wait until this node is Ready
  ansible.builtin.command: "/usr/local/bin/k3s kubectl wait --for=condition=Ready node/{{ ansible_facts['hostname'] }} --timeout=60s"
  register: k3s_ready
  until: k3s_ready.rc == 0
  retries: 5
  delay: 30
  changed_when: false

- name: Apply the CoreDNS tailnet hosts
  ansible.builtin.command: /usr/local/bin/k3s kubectl apply -f -
  args:
    stdin: "{{ lookup('ansible.builtin.template', 'coredns-custom.yaml.j2') }}"
  register: k3s_coredns_custom
  changed_when: "'unchanged' not in k3s_coredns_custom.stdout"

- name: Restart CoreDNS if its config changed
  ansible.builtin.command: /usr/local/bin/k3s kubectl -n kube-system rollout restart deployment/coredns
  when: k3s_coredns_custom.changed
  changed_when: true

- name: Wait for CoreDNS
  ansible.builtin.command: /usr/local/bin/k3s kubectl -n kube-system rollout status deployment/coredns --timeout=100s
  when: k3s_coredns_custom.changed
  changed_when: false
