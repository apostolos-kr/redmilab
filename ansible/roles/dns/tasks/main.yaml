---
- name: Read Tailscale preferences
  ansible.builtin.command: tailscale debug prefs
  register: dns_prefs
  changed_when: false

- name: Set static upstream DNS for resolvconf
  ansible.builtin.lineinfile:
    path: /etc/resolvconf.conf
    search_string: name_servers=
    line: name_servers='1.1.1.1'
    create: true
    mode: "0644"
  register: dns_resolvconf_conf

- name: Disable Tailscale accept-dns
  ansible.builtin.command: tailscale set --accept-dns=false
  when: >-
    '"CorpDNS": true' in dns_prefs.stdout
  changed_when: true

- name: Rebuild resolv.conf from the system resolvers
  ansible.builtin.command: resolvconf -u
  when: >-
    '"CorpDNS": true' in dns_prefs.stdout or
    dns_resolvconf_conf is changed
  changed_when: true
