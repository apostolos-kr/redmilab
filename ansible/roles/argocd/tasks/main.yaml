---
- name: Check whether Argo CD Core is installed
  ansible.builtin.command: /usr/local/bin/k3s kubectl -n argocd get statefulset argocd-application-controller -o name --ignore-not-found
  register: argocd_controller
  changed_when: false
  failed_when: false

- name: Check whether the default AppProject exists
  ansible.builtin.command: /usr/local/bin/k3s kubectl -n argocd get appproject default -o name --ignore-not-found
  register: argocd_project
  changed_when: false
  failed_when: false

- name: Check whether the root Application exists
  ansible.builtin.command: /usr/local/bin/k3s kubectl -n argocd get application root -o name --ignore-not-found
  register: argocd_root
  changed_when: false
  failed_when: false

- name: Bootstrap Argo CD if any resource is missing
  when: >-
    argocd_controller.stdout | trim == '' or
    argocd_project.stdout | trim == '' or
    argocd_root.stdout | trim == ''
  block:
    - name: Copy Argo CD manifests
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../k3s/apps/argocd/"
        dest: /tmp/argocd/
        mode: "0644"
        directory_mode: "0755"

    - name: Apply Argo CD Core
      ansible.builtin.command: /usr/local/bin/k3s kubectl apply --server-side --force-conflicts -k /tmp/argocd
      changed_when: true

    - name: Wait until Argo CD is ready
      ansible.builtin.command: "/usr/local/bin/k3s kubectl -n argocd rollout status {{ item }} --timeout=600s"
      loop:
        - statefulset/argocd-application-controller
        - deployment/argocd-repo-server
        - deployment/argocd-applicationset-controller
        - deployment/argocd-redis
      changed_when: false

    - name: Copy the root Application manifest
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../k3s/bootstrap/root.yaml"
        dest: /tmp/root.yaml
        mode: "0644"

    - name: Apply the root Application
      ansible.builtin.command: /usr/local/bin/k3s kubectl apply -f /tmp/root.yaml
      changed_when: true

    - name: Wait until the root Application is synced
      ansible.builtin.command: "/usr/local/bin/k3s kubectl -n argocd wait --for=jsonpath={.status.sync.status}=Synced application/root --timeout=300s"
      changed_when: false

- name: Check that Infisical credentials are provided
  ansible.builtin.assert:
    that:
      - infisical_client_id | length > 0
      - infisical_client_secret | length > 0
    quiet: true

- name: Ensure the External Secrets namespace exists
  ansible.builtin.command: /usr/local/bin/k3s kubectl apply -f -
  args:
    stdin: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: external-secrets
  register: external_secrets_namespace
  changed_when: "'created' in external_secrets_namespace.stdout or 'configured' in external_secrets_namespace.stdout"

- name: Apply Infisical credentials
  ansible.builtin.command: /usr/local/bin/k3s kubectl apply -f -
  args:
    stdin: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: infisical-universal-auth
        namespace: external-secrets
      type: Opaque
      stringData:
        clientId: {{ infisical_client_id | to_json }}
        clientSecret: {{ infisical_client_secret | to_json }}
  register: infisical_secret
  changed_when: "'created' in infisical_secret.stdout or 'configured' in infisical_secret.stdout"
  no_log: true
