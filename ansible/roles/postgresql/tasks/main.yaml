---
- name: Install PostgreSQL
  ansible.builtin.package:
    name:
      - postgresql{{ postgresql_version }}
      - postgresql{{ postgresql_version }}-client
      - py3-psycopg2
    state: present
    update_cache: true

- name: Initialise the database cluster
  ansible.builtin.command:
    cmd: rc-service postgresql setup
    creates: "/var/lib/postgresql/{{ postgresql_version }}/data/PG_VERSION"

- name: Allow binding to the Tailscale IP before tailscale0 has it
  ansible.posix.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: "1"
    sysctl_file: /etc/sysctl.d/99-nonlocal-bind.conf
    state: present
    reload: true
  notify: Restart postgresql

- name: Listen on localhost and the Tailscale IP only
  ansible.builtin.lineinfile:
    path: /etc/postgresql/postgresql.conf
    search_string: "listen_addresses ="
    line: "listen_addresses = '127.0.0.1,{{ ansible_host }}'"
  notify: Restart postgresql

- name: Allow only the k3s nodes to connect
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: /etc/postgresql/pg_hba.conf
    owner: postgres
    group: postgres
    mode: "0600"
  notify: Reload postgresql

- name: Start Postgres after Tailscale
  ansible.builtin.lineinfile:
    path: /etc/conf.d/postgresql
    search_string: "rc_need="
    line: 'rc_need="tailscale"'

- name: Enable and start Postgres
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Apply pending restarts and reloads
  ansible.builtin.meta: flush_handlers

- name: Database passwords are set
  ansible.builtin.assert:
    that: item.password | length > 0
    quiet: true
  loop: "{{ postgresql_databases }}"
  no_log: true

- name: Create database roles
  community.postgresql.postgresql_user:
    name: "{{ item.user }}"
    password: "{{ item.password }}"
    encrypted: true
  loop: "{{ postgresql_databases }}"
  become: true
  become_user: postgres
  no_log: true

- name: Create databases
  community.postgresql.postgresql_db:
    name: "{{ item.name }}"
    owner: "{{ item.user }}"
  loop: "{{ postgresql_databases }}"
  become: true
  become_user: postgres
  no_log: true
