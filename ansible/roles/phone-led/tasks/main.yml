---
- name: Deploy phone LED script
  ansible.builtin.copy:
    src: phone-led.sh
    dest: /usr/local/bin/phone-led.sh
    mode: "0755"

- name: Turn phone status LED on now
  ansible.builtin.command: /usr/local/bin/phone-led.sh
  register: phone_led
  changed_when: phone_led.stdout | length > 0

- name: Schedule phone status LED at boot
  ansible.builtin.cron:
    name: phone-led
    user: root
    special_time: reboot
    job: "sleep 10 && /usr/local/bin/phone-led.sh"
