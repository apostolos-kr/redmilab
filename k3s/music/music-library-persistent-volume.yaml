---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: music-library
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: music
    name: music-library
  mountOptions:
    - nfsvers=4.1
    - nosuid
  nfs:
    server: netbook.tailba091b.ts.net
    path: /srv/nfs/music
