---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beets
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: beets
  template:
    metadata:
      labels:
        app: beets
    spec:
      nodeSelector:
        kubernetes.io/hostname: xiaomi-whyred
      initContainers:
        - name: create-music-dirs
          image: busybox:1.37.0
          command: ["mkdir", "-p", "/music/inbox", "/music/clean"]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: music
              mountPath: /music
      containers:
        - name: beets
          image: pspitzner/beets-flask:v2.0.0-rc5
          ports:
            - {name: http, containerPort: 5001, protocol: TCP}
          env:
            - name: TZ
              value: Europe/Athens
            - name: USER_ID
              value: "1000"
            - name: GROUP_ID
              value: "1000"
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 60
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /config
            - name: settings
              mountPath: /config/beets-flask/config.yaml
              subPath: beets-flask.yaml
            - name: settings
              mountPath: /config/beets/config.yaml
              subPath: beets.yaml
            - name: music
              mountPath: /music
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: beets-config
        - name: settings
          configMap:
            name: beets-settings
        - name: music
          persistentVolumeClaim:
            claimName: music-library
