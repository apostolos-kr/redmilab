---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: musicgrabber
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: musicgrabber
  template:
    metadata:
      labels:
        app: musicgrabber
    spec:
      nodeSelector:
        kubernetes.io/hostname: xiaomi-whyred
      containers:
        - name: musicgrabber
          image: g33kphr33k/musicgrabber:4.5.0
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: MUSIC_DIR
              value: /music
            - name: DB_PATH
              value: /data/music_grabber.db
            - name: ENABLE_MUSICBRAINZ
              value: "true"
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 60
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: music
              mountPath: /music
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: musicgrabber-data
        - name: music
          persistentVolumeClaim:
            claimName: music-library
        - name: shm
          emptyDir:
            medium: Memory
