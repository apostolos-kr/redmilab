---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: vaultwarden-data
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: vaultwarden
    name: vaultwarden-data
  mountOptions:
    - nfsvers=4.1
    - nosuid
  nfs:
    server: netbook.tailba091b.ts.net
    path: /srv/nfs/vaultwarden
