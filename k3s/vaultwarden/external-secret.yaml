---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: vaultwarden
    creationPolicy: Owner
    template:
      data:
        DATABASE_URL: "postgresql://vaultwarden:{{ .db_password | urlquery }}@netbook.tailba091b.ts.net:5432/vaultwarden?sslmode=disable"
        ADMIN_TOKEN: "{{ .admin_token }}"
  data:
    - secretKey: db_password
      remoteRef:
        key: VAULTWARDEN_DB_PASSWORD
    - secretKey: admin_token
      remoteRef:
        key: VAULTWARDEN_ADMIN_TOKEN
