---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nextcloud-data
spec:
  capacity:
    storage: 40Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: nextcloud
    name: nextcloud-data
  mountOptions:
    - nfsvers=4.1
    - nosuid
  nfs:
    server: netbook.tailba091b.ts.net
    path: /srv/nfs/nextcloud
