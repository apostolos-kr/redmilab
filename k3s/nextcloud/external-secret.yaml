---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: nextcloud
    creationPolicy: Owner
  data:
    - secretKey: postgres_password
      remoteRef:
        key: NEXTCLOUD_DB_PASSWORD
    - secretKey: admin_password
      remoteRef:
        key: NEXTCLOUD_ADMIN_PASSWORD
